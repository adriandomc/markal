app = "markal"
primary_region = "gru"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.http_options.response.headers]
    Strict-Transport-Security = "max-age=31536000; includeSubdomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://www.googleapis.com wss: stun: turn:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self';"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
